<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت رازی‌تک</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--bg:#050816;--card:#0b1120;--card2:#101827;--line:#ffffff14;--muted:#94a3b8;--text:#f8fafc;--p:#7c5cff;--cyan:#21d4fd;--danger:#ef4444;--ok:#22c55e;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#111936 0,#050816 42%);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.login{max-width:430px;margin:10vh auto}.card{background:#0b1120dd;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 15px 45px #0004}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{font-size:13px;color:#a5b4fc}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:4px;margin-bottom:16px}.tab{white-space:nowrap;background:#ffffff08;color:#cbd5e1;border:1px solid var(--line)}.tab.active{background:linear-gradient(135deg,var(--p),var(--cyan));color:#fff;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{margin-bottom:10px}label{font-size:12px;color:#aeb9c9}input,textarea,select{display:block;width:100%;margin-top:7px;background:#070c17;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:#7c5cff88}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--cyan));color:#fff}.ghost{background:#ffffff08;color:#fff;border:1px solid var(--line)}.danger{background:#7f1d1d;color:#fff}.ok{background:#14532d;color:#fff}.warn{background:#78350f;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{padding:11px;border-radius:11px;background:#ffffff08;margin-bottom:12px}.err{color:#fca5a5}.success{color:#86efac}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:12px;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#ffffff0d;color:#cbd5e1;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:25px;display:block;margin-top:5px}.empty{text-align:center;padding:30px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.hidden{display:none!important}.small{font-size:11px}.link{color:#67e8f9;text-decoration:none}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modal>div{max-width:900px;width:100%;max-height:90vh;overflow:auto}.check{display:flex;gap:8px;align-items:center;margin-top:10px}.check input{width:auto;margin:0}@media(max-width:850px){.grid,.grid3,.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:12px}}
</style></head>
<body><main class="wrap" id="app"></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://zhexlpaugdnhnbylpoda.supabase.co',SUPABASE_KEY='sb_publishable_NtW6JGT8nKdAWYMu-xrVCg_MY9NcyN3',sb=createClient(SUPABASE_URL,SUPABASE_KEY),app=document.querySelector('#app');
let state={tab:'overview',courses:[],sessions:[],assignments:[],products:[],resources:[],editing:null,submissions:[],logs:[]};
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
const fmt=d=>d?new Date(d).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}):'—';
const courseName=id=>state.courses.find(c=>c.id===id)?.title||id||'—';
const msg=(t,ok=false)=>{const x=document.querySelector('#msg');if(x)x.innerHTML=`<div class="msg ${ok?'success':'err'}">${esc(t)}</div>`};
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();const{data:p}=await sb.from('profiles').select('role,full_name').eq('id',session.user.id).maybeSingle();if(p?.role!=='admin'){await sb.auth.signOut();return login('این حساب دسترسی مدیر ندارد.')}await loadAll();render(p)}
function login(error=''){app.innerHTML=`<div class="card login"><div class="brand">RAZITECH ACADEMY</div><h1>پنل مدیریت</h1><p class="muted">مدیریت کامل کلاس‌ها، جلسات، تکالیف، نمرات، منابع و فروشگاه</p>${error?`<div class="msg err">${esc(error)}</div>`:''}<form id="login"><div class="field"><label>ایمیل<input id="email" type="email" value="amiralira072@gmail.com" required></label></div><div class="field"><label>رمز عبور<input id="pass" type="password" required></label></div><button class="primary" style="width:100%;margin-top:8px">ورود مدیر</button></form><p class="muted small">احراز هویت با Supabase Auth انجام می‌شود؛ رمز عبور داخل کد ذخیره نشده است.</p></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return login('ایمیل یا رمز عبور نادرست است.');boot()}}
async function loadAll(){const[q1,q2,q3,q4]=await Promise.all([sb.from('courses').select('*').order('created_at',{ascending:false}),sb.from('live_sessions').select('*').order('starts_at',{ascending:false}),sb.from('assignments').select('*').order('deadline',{ascending:true}),sb.from('products').select('*').order('created_at',{ascending:false})]);state.courses=q1.data||[];state.sessions=q2.data||[];state.assignments=q3.data||[];state.products=q4.data||[]}
function nav(){return `<div class="tabs">${[['overview','داشبورد'],['courses','دوره‌ها'],['sessions','کلاس‌های آنلاین'],['assignments','تکالیف و نمرات'],['resources','منابع جلسات'],['products','فروشگاه']].map(([id,t])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${t}</button>`).join('')}</div>`}
function render(profile={}){app.innerHTML=`<div class="top"><div><div class="brand">RAZITECH ADMIN CENTER</div><h1 style="margin:4px 0">پنل مدیریت رازی‌تک</h1><div class="muted">${esc(profile.full_name||'مدیر سیستم')}</div></div><div class="actions"><button class="ghost" id="refresh">بازخوانی</button><button class="ghost" id="logout">خروج</button></div></div>${nav()}<div id="msg"></div><section id="content"></section>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render(profile)});document.querySelector('#refresh').onclick=()=>boot();document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();login()};content()}
function content(){const c=document.querySelector('#content');if(state.tab==='overview')return overview(c);if(state.tab==='courses')return courses(c);if(state.tab==='sessions')return sessions(c);if(state.tab==='assignments')return assignments(c);if(state.tab==='resources')return resources(c);if(state.tab==='products')return products(c)}
function overview(c){const now=Date.now();const upcoming=state.sessions.filter(x=>new Date(x.starts_at)>now).length,pending=0;c.innerHTML=`<div class="stats"><div class="card stat"><span class="muted">دوره‌ها</span><b>${state.courses.length}</b></div><div class="card stat"><span class="muted">کلاس آنلاین</span><b>${state.sessions.length}</b><small class="muted">${upcoming} جلسه آینده</small></div><div class="card stat"><span class="muted">تکالیف</span><b>${state.assignments.length}</b></div><div class="card stat"><span class="muted">محصولات</span><b>${state.products.length}</b></div></div><div class="card"><div class="section-title"><h2>کلاس‌های آینده</h2><button class="ghost" id="goSessions">مدیریت کلاس‌ها</button></div>${state.sessions.filter(x=>new Date(x.starts_at)>now).slice(0,5).map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><span class="badge">${esc(courseName(x.course_id))}</span><div class="muted small">${fmt(x.starts_at)} · ${x.duration_minutes||120} دقیقه · ظرفیت ${x.capacity}</div></div>`).join('')||'<div class="empty">کلاس آینده‌ای ثبت نشده است.</div>'}</div>`;document.querySelector('#goSessions').onclick=()=>{state.tab='sessions';render()}}
function courses(c){c.innerHTML=`<div class="card"><div class="section-title"><h2>${state.editing?'ویرایش دوره':'افزودن دوره'}</h2>${state.editing?'<button id="cancel" class="ghost">انصراف</button>':''}</div><form id="courseForm"><div class="grid"><div class="field"><label>عنوان دوره<input id="ctitle" required value="${esc(state.editing?.title)}"></label></div><div class="field"><label>اسلاگ<input id="cslug" value="${esc(state.editing?.slug)}" placeholder="robotics-beginner"></label></div></div><div class="field"><label>توضیحات<textarea id="cdesc">${esc(state.editing?.description)}</textarea></label></div><button class="primary">${state.editing?'ذخیره تغییرات':'ایجاد دوره'}</button></form></div><div class="card"><div class="section-title"><h2>دوره‌ها (${state.courses.length})</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>عنوان</th><th>اسلاگ</th><th>توضیحات</th><th>عملیات</th></tr></thead><tbody>${state.courses.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.slug)}</td><td>${esc((x.description||'').slice(0,100))}</td><td><div class="actions"><button class="ghost" data-ce="${x.id}">ویرایش</button><button class="danger" data-cd="${x.id}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">دوره‌ای وجود ندارد.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#courseForm').onsubmit=saveCourse;if(state.editing)document.querySelector('#cancel').onclick=()=>{state.editing=null;render()};document.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{state.editing=state.courses.find(x=>x.id===b.dataset.ce);render()});document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>deleteCourse(b.dataset.cd))}
async function saveCourse(e){e.preventDefault();const row={title:ctitle.value,slug:cslug.value||ctitle.value.trim().toLowerCase().replace(/\s+/g,'-'),description:cdesc.value};const r=state.editing?await sb.from('courses').update(row).eq('id',state.editing.id):await sb.from('courses').insert([row]);if(r.error)return msg(r.error.message);state.editing=null;await boot()}
async function deleteCourse(id){if(!confirm('دوره و اطلاعات وابسته حذف شود؟'))return;const r=await sb.from('courses').delete().eq('id',id);if(r.error)return msg(r.error.message);await boot()}
function courseSelect(id=''){return `<select id="course" required><option value="">انتخاب دوره</option>${state.courses.map(c=>`<option value="${c.id}" ${id===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>`}
function sessions(c){c.innerHTML=`<div class="card"><div class="section-title"><h2>${state.editing?'ویرایش کلاس آنلاین':'ساخت کلاس آنلاین'}</h2>${state.editing?'<button id="cancel" class="ghost">انصراف</button>':''}</div><form id="sessionForm"><div class="grid"><div class="field"><label>دوره${courseSelect(state.editing?.course_id)}</label></div><div class="field"><label>عنوان کلاس<input id="stitle" required value="${esc(state.editing?.title)}"></label></div><div class="field"><label>تاریخ و ساعت شروع<input id="sstart" type="datetime-local" required value="${localInput(state.editing?.starts_at)}"></label></div><div class="field"><label>مدت (دقیقه)<input id="sduration" type="number" min="1" value="${state.editing?.duration_minutes||120}"></label></div><div class="field"><label>ظرفیت<input id="scapacity" type="number" min="1" value="${state.editing?.capacity||20}"></label></div><div class="field"><label>حداکثر ورود هر دانش‌آموز<select id="smax"><option value="1" ${state.editing?.default_max_entries===1?'selected':''}>۱ بار</option><option value="2" ${state.editing?.default_max_entries===2?'selected':''}>۲ بار</option></select></label></div><div class="field"><label>لینک Google Meet<input id="smeet" type="url" required value="${esc(state.editing?.meet_url)}" placeholder="https://meet.google.com/..."></label></div></div><div class="field"><label>توضیحات<textarea id="sdesc">${esc(state.editing?.description)}</textarea></label></div><button class="primary">${state.editing?'ذخیره کلاس':'ایجاد کلاس'}</button></form></div><div class="card"><div class="section-title"><h2>کلاس‌های آنلاین</h2><span class="badge">پنجره ورود: ۲ ساعت</span></div><div class="table-wrap"><table class="table"><thead><tr><th>کلاس</th><th>دوره</th><th>شروع</th><th>ظرفیت</th><th>ورود</th><th>عملیات</th></tr></thead><tbody>${state.sessions.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted small">${esc(x.description||'')}</div></td><td>${esc(courseName(x.course_id))}</td><td>${fmt(x.starts_at)}</td><td>${x.capacity}</td><td>حداکثر ${x.default_max_entries}</td><td><div class="actions"><button class="ghost" data-se="${x.id}">ویرایش</button><button class="ghost" data-log="${x.id}">حضور/ورود</button><button class="danger" data-sd="${x.id}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">کلاسی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#sessionForm').onsubmit=saveSession;if(state.editing)document.querySelector('#cancel').onclick=()=>{state.editing=null;render()};document.querySelectorAll('[data-se]').forEach(b=>b.onclick=()=>{state.editing=state.sessions.find(x=>x.id===b.dataset.se);render()});document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>deleteSession(b.dataset.sd));document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>showLogs(b.dataset.log))}
function localInput(v){if(!v)return'';const d=new Date(v),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
async function saveSession(e){e.preventDefault();const row={course_id:course.value,title:stitle.value,starts_at:new Date(sstart.value).toISOString(),duration_minutes:Number(sduration.value)||120,capacity:Number(scapacity.value)||20,default_max_entries:Number(smax.value),meet_url:smeet.value,description:sdesc.value};const r=state.editing?await sb.from('live_sessions').update({...row,updated_at:new Date().toISOString()}).eq('id',state.editing.id):await sb.from('live_sessions').insert([row]);if(r.error)return msg(r.error.message);state.editing=null;await boot()}
async function deleteSession(id){if(!confirm('این کلاس حذف شود؟'))return;const r=await sb.from('live_sessions').delete().eq('id',id);if(r.error)return msg(r.error.message);await boot()}
async function showLogs(id){const{data,error}=await sb.from('session_logs').select('*').eq('session_id',id).order('last_entered_at',{ascending:false});if(error)return msg(error.message);const rows=data||[];modal(`<h2>گزارش ورود کلاس</h2>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>دانش‌آموز</th><th>تعداد ورود</th><th>سقف</th><th>آخرین ورود</th><th>درخواست ورود مجدد</th><th>عملیات</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td>${x.entry_count}</td><td>${x.max_entries}</td><td>${fmt(x.last_entered_at)}</td><td>${x.emergency_requested?'بله':'خیر'}</td><td>${x.entry_count>=x.max_entries?`<button class="ok" data-grant="${x.user_id}">اجازه ورود مجدد</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">هنوز ورودی ثبت نشده است.</div>'}<button class="ghost" id="closeModal">بستن</button>`);document.querySelector('#closeModal').onclick=closeModal;document.querySelectorAll('[data-grant]').forEach(b=>b.onclick=async()=>{const r=await sb.rpc('admin_grant_reentry',{p_session_id:id,p_user_id:b.dataset.grant});if(r.error)return alert(r.error.message);closeModal();showLogs(id)})}
function assignments(c){c.innerHTML=`<div class="card"><div class="section-title"><h2>${state.editing?'ویرایش تکلیف':'ایجاد تکلیف'}</h2>${state.editing?'<button id="cancel" class="ghost">انصراف</button>':''}</div><form id="assignmentForm"><div class="grid"><div class="field"><label>دوره${courseSelect(state.editing?.course_id)}</label></div><div class="field"><label>عنوان تکلیف<input id="atitle" required value="${esc(state.editing?.title)}"></label></div><div class="field"><label>مهلت تحویل<input id="adeadline" type="datetime-local" required value="${localInput(state.editing?.deadline)}"></label></div><div class="field"><label>لینک فایل/جزوه مدرس<input id="aurl" type="url" value="${esc(state.editing?.attachment_url)}"></label></div></div><div class="field"><label>شرح تکلیف<textarea id="adesc">${esc(state.editing?.description)}</textarea></label></div><button class="primary">${state.editing?'ذخیره تغییرات':'ایجاد تکلیف'}</button></form></div><div class="card"><div class="section-title"><h2>تکالیف و نمرات</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>تکلیف</th><th>دوره</th><th>مهلت</th><th>وضعیت نمرات</th><th>عملیات</th></tr></thead><tbody>${state.assignments.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted small">${esc((x.description||'').slice(0,80))}</div></td><td>${esc(courseName(x.course_id))}</td><td>${fmt(x.deadline)}</td><td>${x.is_grades_published?'<span class="badge">منتشر شده</span>':'<span class="badge">مخفی</span>'}</td><td><div class="actions"><button class="ghost" data-ae="${x.id}">ویرایش</button><button class="ghost" data-as="${x.id}">ارسالی‌ها</button>${!x.is_grades_published?`<button class="ok" data-ap="${x.id}">انتشار نمرات</button>`:'<span class="badge">نمرات منتشر شده</span>'}<button class="danger" data-ad="${x.id}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">تکلیفی وجود ندارد.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#assignmentForm').onsubmit=saveAssignment;if(state.editing)document.querySelector('#cancel').onclick=()=>{state.editing=null;render()};document.querySelectorAll('[data-ae]').forEach(b=>b.onclick=()=>{state.editing=state.assignments.find(x=>x.id===b.dataset.ae);render()});document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=()=>deleteAssignment(b.dataset.ad));document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>publishGrades(b.dataset.ap));document.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>showSubmissions(b.dataset.as))}
async function saveAssignment(e){e.preventDefault();const row={course_id:course.value,title:atitle.value,description:adesc.value,deadline:new Date(adeadline.value).toISOString(),attachment_url:aurl.value||'',is_grades_published:state.editing?.is_grades_published||false};const r=state.editing?await sb.from('assignments').update({...row,updated_at:new Date().toISOString()}).eq('id',state.editing.id):await sb.from('assignments').insert([row]);if(r.error)return msg(r.error.message);state.editing=null;await boot()}
async function deleteAssignment(id){if(!confirm('تکلیف حذف شود؟'))return;const r=await sb.from('assignments').delete().eq('id',id);if(r.error)return msg(r.error.message);await boot()}
async function publishGrades(id){if(!confirm('نمرات این تکلیف برای دانش‌آموزان منتشر شود؟'))return;const r=await sb.from('assignments').update({is_grades_published:true,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return msg(r.error.message);await boot()}
async function showSubmissions(id){const a=state.assignments.find(x=>x.id===id);const{data,error}=await sb.from('assignment_submissions').select('*').eq('assignment_id',id).order('graded_at',{ascending:false});if(error)return msg(error.message);const rows=data||[];modal(`<h2>ارسالی‌های «${esc(a?.title)}»</h2>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>دانش‌آموز</th><th>فایل</th><th>یادداشت</th><th>نمره از ۵</th><th>بازخورد</th><th>وضعیت</th><th>ذخیره</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.user_id)}</td><td><a class="link" href="${esc(x.file_url)}" target="_blank" rel="noopener">مشاهده فایل</a></td><td>${esc(x.note)}</td><td><input data-score="${x.id}" type="number" min="0" max="5" step="0.5" value="${x.score??''}"></td><td><textarea data-feedback="${x.id}" style="min-width:180px">${esc(x.feedback)}</textarea></td><td>${esc(x.status)}</td><td><button class="primary" data-savegrade="${x.id}">ثبت نمره</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">هنوز ارسالی وجود ندارد.</div>'}<button class="ghost" id="closeModal">بستن</button>`);document.querySelector('#closeModal').onclick=closeModal;document.querySelectorAll('[data-savegrade]').forEach(b=>b.onclick=async()=>{const id=b.dataset.savegrade,score=Number(document.querySelector(`[data-score="${id}"]`).value),feedback=document.querySelector(`[data-feedback="${id}"]`).value;if(!Number.isFinite(score)||score<0||score>5)return alert('نمره باید بین ۰ تا ۵ باشد.');const r=await sb.from('assignment_submissions').update({score,status:'graded',feedback,graded_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);alert('نمره ثبت شد.')})}
function resources(c){c.innerHTML=`<div class="card"><h2>افزودن منبع جلسه</h2><form id="resourceForm"><div class="grid"><div class="field"><label>جلسه<select id="rsession" required><option value="">انتخاب جلسه</option>${state.sessions.map(x=>`<option value="${x.id}">${esc(x.title)} — ${fmt(x.starts_at)}</option>`).join('')}</select></label></div><div class="field"><label>عنوان منبع<input id="rtitle" required></label></div><div class="field"><label>نوع منبع<select id="rtype"><option value="file">فایل</option><option value="product_link">محصول فروشگاه</option><option value="external_link">لینک خارجی</option></select></label></div><div class="field"><label>لینک<input id="rurl" type="url" required placeholder="https://..."></label></div><div class="field"><label>شناسه محصول (اختیاری)<input id="rproduct"></label></div></div><button class="primary">افزودن منبع</button></form></div><div class="card"><div class="section-title"><h2>منابع ثبت‌شده</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>عنوان</th><th>جلسه</th><th>نوع</th><th>لینک</th><th>محصول</th><th></th></tr></thead><tbody>${state.resources.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(state.sessions.find(s=>s.id===x.session_id)?.title||x.session_id)}</td><td>${esc(x.resource_type)}</td><td><a class="link" href="${esc(x.url)}" target="_blank">باز کردن</a></td><td>${esc(x.product_id)}</td><td><button class="danger" data-rd="${x.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">برای نمایش منابع، بازخوانی را بزنید.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#resourceForm').onsubmit=saveResource;document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>deleteResource(b.dataset.rd))}
async function loadResources(){const{data}=await sb.from('session_resources').select('*').order('created_at',{ascending:false});state.resources=data||[]}
async function saveResource(e){e.preventDefault();const row={session_id:rsession.value,title:rtitle.value,resource_type:rtype.value,url:rurl.value,product_id:rproduct.value||null};const r=await sb.from('session_resources').insert([row]);if(r.error)return msg(r.error.message);await loadResources();content()}
async function deleteResource(id){if(!confirm('منبع حذف شود؟'))return;const r=await sb.from('session_resources').delete().eq('id',id);if(r.error)return msg(r.error.message);await loadResources();content()}
function products(c){c.innerHTML=`<div class="card"><div class="section-title"><h2>${state.editing?'ویرایش محصول':'افزودن محصول'}</h2>${state.editing?'<button id="cancel" class="ghost">انصراف</button>':''}</div><form id="productForm"><div class="grid3"><div class="field"><label>نام<input id="ptitle" required value="${esc(state.editing?.title)}"></label></div><div class="field"><label>قیمت (تومان)<input id="pprice" type="number" min="0" value="${state.editing?.price??0}"></label></div><div class="field"><label>موجودی<input id="pstock" type="number" min="0" value="${state.editing?.stock??0}"></label></div><div class="field"><label>دسته‌بندی<input id="pcat" value="${esc(state.editing?.category||'عمومی')}"></label></div><div class="field"><label>نوع<select id="ptype"><option value="physical_hardware" ${state.editing?.type==='physical_hardware'?'selected':''}>سخت‌افزار</option><option value="digital" ${state.editing?.type==='digital'?'selected':''}>دیجیتال</option><option value="service" ${state.editing?.type==='service'?'selected':''}>خدمات</option></select></label></div><div class="field"><label>تصویر<input id="pimage" value="${esc(state.editing?.image_url)}"></label></div></div><div class="field"><label>توضیحات<textarea id="pdesc">${esc(state.editing?.description)}</textarea></label></div><label class="check"><input id="pfeatured" type="checkbox" ${state.editing?.featured?'checked':''}> محصول ویژه</label><button class="primary" style="margin-top:12px">${state.editing?'ذخیره':'افزودن محصول'}</button></form></div><div class="card"><div class="section-title"><h2>محصولات (${state.products.length})</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>نام</th><th>قیمت</th><th>موجودی</th><th>دسته</th><th></th></tr></thead><tbody>${state.products.map(x=>`<tr><td>${esc(x.title)}</td><td>${Number(x.price||0).toLocaleString('fa-IR')}</td><td>${x.stock}</td><td>${esc(x.category)}</td><td><div class="actions"><button class="ghost" data-pe="${x.id}">ویرایش</button><button class="danger" data-pd="${x.id}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">محصولی وجود ندارد.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#productForm').onsubmit=saveProduct;if(state.editing)document.querySelector('#cancel').onclick=()=>{state.editing=null;render()};document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{state.editing=state.products.find(x=>x.id===b.dataset.pe);render()});document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.pd))}
async function saveProduct(e){e.preventDefault();const row={title:ptitle.value,price:Number(pprice.value)||0,stock:Number(pstock.value)||0,category:pcat.value||'عمومی',type:ptype.value,image_url:pimage.value||'',description:pdesc.value,featured:pfeatured.checked,slug:ptitle.value.trim().toLowerCase().replace(/\s+/g,'-')};const r=state.editing?await sb.from('products').update(row).eq('id',state.editing.id):await sb.from('products').insert([{id:crypto.randomUUID(),...row}]);if(r.error)return msg(r.error.message);state.editing=null;await boot()}
async function deleteProduct(id){if(!confirm('محصول حذف شود؟'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return msg(r.error.message);await boot()}
function modal(html){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card">${html}</div></div>`)}function closeModal(){document.querySelector('#modal')?.remove()}
await loadResources();boot();
</script></body></html>
