<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت رازی‌تک</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#060914;color:#f4f7fb;font-family:Vazirmatn,system-ui}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.card{background:#0b1120;border:1px solid #ffffff18;border-radius:20px;padding:22px;margin-bottom:18px}.login{max-width:430px;margin:8vh auto}.h{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#aab5c7}input,textarea,select{display:block;width:100%;margin-top:7px;background:#080d19;border:1px solid #ffffff18;color:#fff;border-radius:10px;padding:11px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#7c5cff,#21d4fd);color:white}.danger{background:#7f1d1d;color:#fff}.ghost{background:#ffffff0b;color:#fff;border:1px solid #ffffff15}.msg{padding:10px;border-radius:10px;margin:12px 0;background:#ffffff08}.err{color:#fca5a5}.ok{color:#86efac}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #ffffff10;text-align:right;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.h{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap" id="app"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const URL='https://zhexlpaugdnhnbylpoda.supabase.co',KEY='sb_publishable_NtW6JGT8nKdAWYMu-xrVCg_MY9NcyN3',sb=createClient(URL,KEY),app=document.querySelector('#app');
let products=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();const{data:p,error}=await sb.from('profiles').select('role,full_name').eq('id',session.user.id).maybeSingle();if(error||p?.role!=='admin'){await sb.auth.signOut();return login('این حساب دسترسی مدیر ندارد.')}dashboard(p)}
function login(msg=''){app.innerHTML=`<div class="card login"><h1>پنل مدیریت رازی‌تک</h1><p class="muted">ورود مدیر برای مدیریت محصولات</p>${msg?`<div class="msg err">${esc(msg)}</div>`:''}<form id="login"><label>ایمیل<input id="email" type="email" value="amiralira072@gmail.com" required></label><label>رمز عبور<input id="pass" type="password" required></label><button class="primary" style="width:100%;margin-top:15px">ورود مدیر</button></form><p class="muted" style="font-size:11px">رمز عبور در کد ذخیره نشده و توسط Supabase Auth بررسی می‌شود.</p></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)return login('ایمیل یا رمز عبور نادرست است.');boot()}}
async function dashboard(profile){await load();app.innerHTML=`<div class="h"><div><div class="muted">RAZITECH ADMIN</div><h1>مدیریت محصولات</h1><div class="muted">مدیر: ${esc(profile.full_name||'amiralirazi1391')}</div></div><button id="logout" class="ghost">خروج</button></div><div id="msg"></div><div class="card"><div class="h"><h2>${editing?'ویرایش محصول':'افزودن محصول جدید'}</h2>${editing?'<button id="cancel" class="ghost">انصراف</button>':''}</div><form id="productForm"><div class="grid"><label>نام محصول<input id="title" required value="${esc(editing?.title)}"></label><label>قیمت (تومان)<input id="price" type="number" min="0" required value="${editing?.price??0}"></label><label>موجودی<input id="stock" type="number" min="0" required value="${editing?.stock??0}"></label><label>دسته‌بندی<input id="category" value="${esc(editing?.category||'عمومی')}"></label><label>نوع محصول<select id="type"><option value="physical_hardware" ${editing?.type==='physical_hardware'?'selected':''}>سخت‌افزار</option><option value="digital" ${editing?.type==='digital'?'selected':''}>دیجیتال</option><option value="service" ${editing?.type==='service'?'selected':''}>خدمات</option></select></label><label>آدرس تصویر<input id="image_url" value="${esc(editing?.image_url)}"></label></div><label>توضیحات<textarea id="description">${esc(editing?.description)}</textarea></label><label>آیکون<input id="icon" value="${esc(editing?.icon||'🛍️')}"></label><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="featured" type="checkbox" ${editing?.featured?'checked':''} style="width:auto;margin:0"> محصول ویژه</label><button class="primary" style="margin-top:15px">${editing?'ذخیره تغییرات':'افزودن محصول'}</button></form></div><div class="card"><div class="h"><h2>محصولات (${products.length})</h2><button id="refresh" class="ghost">بازخوانی</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>نام</th><th>قیمت</th><th>موجودی</th><th>دسته‌بندی</th><th>عملیات</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.title)}</td><td>${Number(p.price||0).toLocaleString('fa-IR')}</td><td>${p.stock}</td><td>${esc(p.category)}</td><td><div class="actions"><button class="ghost" data-edit="${esc(p.id)}">ویرایش</button><button class="danger" data-delete="${esc(p.id)}">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">هنوز محصولی ثبت نشده است.</td></tr>'}</tbody></table></div></div>`;
 document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();login()};document.querySelector('#refresh').onclick=()=>dashboard(profile);if(editing)document.querySelector('#cancel').onclick=()=>{editing=null;dashboard(profile)};
 document.querySelector('#productForm').onsubmit=save;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=products.find(x=>x.id===b.dataset.edit);dashboard(profile)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete));}
async function load(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){products=[];return}products=data||[]}
async function save(e){e.preventDefault();const row={title:title.value,description:description.value,price:Number(price.value),stock:Number(stock.value),type:type.value,category:category.value||'عمومی',image_url:image_url.value||'',icon:icon.value||'🛍️',featured:featured.checked,slug:(title.value||'product').toLowerCase().replace(/\s+/g,'-')};let r=editing?await sb.from('products').update(row).eq('id',editing.id):await sb.from('products').insert([{id:crypto.randomUUID(),...row}]);if(r.error)return alert(r.error.message);editing=null;await dashboard({full_name:'amiralirazi1391'})}
async function remove(id){if(!confirm('این محصول حذف شود؟'))return;const{error}=await sb.from('products').delete().eq('id',id);if(error)return alert(error.message);await dashboard({full_name:'amiralirazi1391'})}
boot();
</script></body></html>
